# On a v* tag: build and test, then publish a DEMO APK as a GitHub Release with its SHA-256 and generated notes.
# The APK is re-signed with a throwaway key generated inside this job and deleted at the end, so it is not tied to
# any real install. Updates can't be installed over it; it's for trying the app, not for daily use.
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Demo release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build and test
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest -Pkotlin.incremental=false

      - name: Sign with a throwaway demo key
        id: apk
        env:
          TAG: ${{ github.ref_name }}
        run: |
          KS_PASS=$(openssl rand -hex 24); export KS_PASS
          ks="$RUNNER_TEMP/demo.p12"
          keytool -genkeypair -noprompt -storetype PKCS12 -keystore "$ks" -storepass "$KS_PASS" -alias demo \
            -keyalg EC -groupname secp256r1 -sigalg SHA256withECDSA -validity 3650 -dname "CN=Zeus demo build, O=Showcase"
          signer=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          apk="zeus-demo-$TAG.apk"
          "$signer" sign --ks "$ks" --ks-pass env:KS_PASS --ks-key-alias demo --out "$apk" app/build/outputs/apk/debug/app-debug.apk
          rm -f "$ks"
          cert=$("$signer" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          [ -n "$cert" ] || { echo "::error::apksigner did not verify the demo APK"; exit 1; }
          sha256sum "$apk" > "$apk.sha256"
          echo "file=$apk" >> "$GITHUB_OUTPUT"
          echo "sha=$(cut -d' ' -f1 "$apk.sha256")" >> "$GITHUB_OUTPUT"
          echo "cert=$cert" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          APK: ${{ steps.apk.outputs.file }}
          APK_SHA: ${{ steps.apk.outputs.sha }}
          CERT: ${{ steps.apk.outputs.cert }}
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle.kts | head -1)
          {
            echo "Demo build of Zeus $version from \`$GITHUB_SHA\`."
            echo
            echo "- APK SHA-256: \`$APK_SHA\`"
            echo "- Signed with a one-off key generated in this workflow (certificate SHA-256 \`$CERT\`). It is not the"
            echo "  owner's key, so it can't update a real install. Placeholders (Firebase, gateway host) are not filled in."
            echo
          } > notes.md
          gh release create "$TAG" "$APK" "$APK.sha256" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Zeus $TAG (demo)" --notes-file notes.md --generate-notes

      - name: Job summary
        if: always()
        env:
          TAG: ${{ github.ref_name }}
          APK: ${{ steps.apk.outputs.file }}
          APK_SHA: ${{ steps.apk.outputs.sha }}
        run: |
          {
            echo "### Demo release $TAG"
            echo
            echo "- APK: \`$APK\`"
            echo "- SHA-256: \`$APK_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
          python3 .github/scripts/junit_summary.py "Unit tests" app/build/test-results >> "$GITHUB_STEP_SUMMARY"
