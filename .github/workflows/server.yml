# zeus-gateway's pytest suite on Linux (the gateway uses fcntl, pwd and O_NOFOLLOW, so it is Linux-only).
name: server

on:
  pull_request:
    paths: ["server/**", ".github/workflows/server.yml", ".github/scripts/**"]
  push:
    branches: [main]
    paths: ["server/**", ".github/workflows/server.yml", ".github/scripts/**"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Server tests (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install
        run: python -m pip install --disable-pip-version-check -r server/requirements.txt

      - name: pytest
        run: python -m pytest server/tests -q -p no:cacheprovider --junitxml=server-results.xml

      - name: Test summary
        if: always()
        run: python3 .github/scripts/junit_summary.py "Server tests" server-results.xml >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-test-results
          path: server-results.xml
          if-no-files-found: ignore
          retention-days: 14
